<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1424">
<title>グラフの道具</title>
<style>
:root{--bg:#0f1424;--card:#1a2340;--line:#2c3860;--text:#eef1f8;--sub:#9aa6c4;--red:#ff5a5f;--gold:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
body{padding:0 16px calc(28px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 10px}
h1{font-size:18px;margin:0 0 10px;letter-spacing:.04em}
.tabs{display:flex;gap:8px}
button,select{font:inherit;font-size:15px;font-weight:600;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:46px;touch-action:manipulation}
button{padding:0 12px;cursor:pointer;transition:transform .06s}
button:active{transform:scale(.95)}
.tabs button{flex:1}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.stage{background:#0b1022;border:1px solid var(--line);border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.hint{font-size:13px;line-height:1.5;color:var(--sub);margin:8px 2px 12px;min-height:1.5em}
.row{display:flex;gap:8px;margin:0 0 10px}
.row>button,.row>label,.row>a{flex:1}
button.on{background:#3b2f0a;border-color:var(--gold);color:var(--gold)}
label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);white-space:nowrap}
label select{flex:1;min-width:0;padding:0 8px}
.pad{display:grid;grid-template-columns:3fr 2fr;gap:8px;margin:0 0 10px}
.disp{grid-column:1/-1;display:flex;align-items:baseline;justify-content:flex-end;gap:6px;background:#0b1022;border:1px solid var(--line);border-radius:10px;padding:6px 14px;min-height:56px}
.disp b{font-size:34px;font-variant-numeric:tabular-nums}
.disp small{font-size:16px;color:var(--sub)}
.disp i{font-style:normal;font-size:12px;color:var(--gold);margin-right:auto;align-self:center}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{font-size:22px;min-height:52px}
.types{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:6px}
.types button{border:none;color:#fff;font-size:17px;padding:0;white-space:nowrap}
.make{width:100%;min-height:56px;font-size:17px;background:var(--red);border-color:var(--red);color:#fff;margin-top:4px}
.out{position:fixed;inset:0;z-index:20;background:rgba(5,8,18,.95);overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.out .box{max-width:720px;margin:0 auto}
.out img{display:block;width:100%;border-radius:10px;-webkit-touch-callout:default}
.out p{font-size:14px;line-height:1.6;margin:12px 2px}
.out a{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;font-weight:600;font-size:15px;background:var(--card)}
</style>
</head>
<body>
<header>
  <h1>グラフの道具</h1>
  <div class="tabs"><button id="tabSa">差枚グラフ</button><button id="tabRi">当選履歴</button></div>
</header>
<div class="stage"><canvas id="cv"></canvas></div>
<p class="hint" id="hint"></p>

<section id="paneSa">
  <div class="row"><button id="saLabel">連の札</button><button id="saUndo">戻す</button><button id="saClear">全部消す</button></div>
  <div class="row">
    <label>日の数<select id="saDays"><option value="3">3日</option><option value="2">2日</option><option value="1">本日だけ</option></select></label>
    <label>幅<select id="saRange"><option value="3000">±3000</option><option value="6000">±6000</option><option value="10000">±10000</option><option value="20000">±20000</option></select></label>
  </div>
</section>

<section id="paneRi">
  <div class="pad">
    <div class="disp"><i id="numNote"></i><b id="num">0</b><small>G</small></div>
    <div class="keys" id="keys"></div>
    <div class="types">
      <button data-t="AT" style="background:#8a5cf6">AT</button>
      <button data-t="CZ" style="background:#2f7bea">CZ</button>
      <button data-t="BIG" style="background:#e5484d">BIG</button>
      <button data-t="REG" style="background:#22a065">REG</button>
      <button data-t="現在" style="background:#56627e">現在</button>
      <button data-t="他" style="background:#e8862a">その他</button>
    </div>
  </div>
  <div class="row" id="selRow"><button id="riDel">選んだ棒を消す</button><button id="riIns">前に1本足す</button></div>
  <div class="row"><button id="riArrow">連の矢印</button><button id="riUndo">戻す</button><button id="riClear">全部消す</button></div>
  <div class="row"><label>棒の上限<select id="riMax"><option value="1000">1000G</option><option value="1500">1500G</option><option value="2000">2000G</option><option value="3000">3000G</option></select></label></div>
</section>

<button class="make" id="make">画像にする</button>

<div class="out" id="out" hidden>
  <div class="box">
    <img id="outImg" alt="できた画像">
    <p>画像を長押しして「"写真"に保存」で、スマホの写真に入ります。</p>
    <div class="row"><button id="share" hidden>保存・送る</button><a id="dl" href="#">ファイルで保存</a><button id="close">閉じる</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif';
const BG = '#0b1022';
const DAY = {d2: {name: '2日前', color: '#7bd84a'}, d1: {name: '1日前', color: '#f2cf1d'}, d0: {name: '本日', color: '#ff4d4d'}};
const TYPE_COLOR = {AT: '#8a5cf6', CZ: '#2f7bea', BIG: '#e5484d', REG: '#22a065'};
const OTHER_COLOR = '#e8862a', CUR_COLOR = '#56627e';
const KEY = 'nerai-graph-v1';

// 作りかけはこの端末だけに残す（外には送らない）
function fresh() {
  return {tab: 'sa', sa: {days: 3, range: 6000, pts: {d2: [], d1: [], d0: []}, labels: []},
          ri: {max: 1000, cur: null, list: [], arrows: [], other: 'ART'}};
}
let S = fresh();
try {
  const t = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (t && t.sa && t.ri) { S.tab = t.tab === 'ri' ? 'ri' : 'sa'; Object.assign(S.sa, t.sa); Object.assign(S.ri, t.ri); }
} catch (_) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} }

const hist = {sa: [], ri: []};
function snap() { const k = S.tab; hist[k].push(JSON.stringify(S[k])); if (hist[k].length > 200) hist[k].shift(); }
function undo() {
  const k = S.tab;
  if (!hist[k].length) { setHint('これ以上は戻せません'); return; }
  S[k] = JSON.parse(hist[k].pop()); sel = null; arrowMode = 0; labelMode = false; changed();
}

let sel = null, arrowMode = 0, arrowStart = -1, labelMode = false, num = '', drag = null, saHits = [], riHits = [], outFile = null;

function changed() { save(); render(); sync(); }
function setHint(t) { $('hint').textContent = t; }
function defaultHint() {
  setHint(S.tab === 'sa'
    ? 'グラフをタップ＝点を置く　点を引っぱる＝動かす　枠の外へ引っぱる＝消す'
    : '数字を打って種類を押す＝棒が1本ふえる（左が新しい）　棒をタップ＝選んで書きかえ');
}
function toHalf(s) { return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).trim(); }
function normLabel(s) { s = toHalf(s); return /^\d+$/.test(s) ? s + '連' : s.slice(0, 8); }
function askLabel(def) {
  const s = prompt('何連？（数字だけでよい。字も打てます）', def);
  return s === null || !toHalf(s) ? null : normLabel(s);
}
function fmtV(v) { return (v > 0 ? '+' : '') + v.toLocaleString('ja-JP'); }
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function outlined(t, x, y, fill) {
  ctx.lineJoin = 'round'; ctx.lineWidth = 10; ctx.strokeStyle = BG; ctx.strokeText(t, x, y);
  ctx.fillStyle = fill; ctx.fillText(t, x, y);
}
function pos(e) {
  const r = cv.getBoundingClientRect(), k = cv.width / r.width;
  return {x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k, k};
}
function render(exp) { if (S.tab === 'sa') drawSa(!!exp); else drawRi(!!exp); }

// ---- 差枚グラフ ----
const SA = {W: 1200, H: 800, L: 24, R: 1030, T: 110, B: 770};
function dayKeys() { return S.sa.days == 3 ? ['d2', 'd1', 'd0'] : S.sa.days == 2 ? ['d1', 'd0'] : ['d0']; }
function secW() { return (SA.R - SA.L) / dayKeys().length; }
function secX(d) { return SA.L + dayKeys().indexOf(d) * secW(); }
function vToY(v) { const r = S.sa.range; return SA.T + (SA.B - SA.T) * (r - v) / (2 * r); }
function yToV(y) {
  const r = S.sa.range, v = Math.round((r - (y - SA.T) / (SA.B - SA.T) * 2 * r) / 50) * 50;
  return Math.max(-r, Math.min(r, v));
}
function dayAt(x) { const k = dayKeys(); return k[Math.max(0, Math.min(k.length - 1, Math.floor((x - SA.L) / secW())))]; }
function fAt(d, x) { return Math.max(0, Math.min(1, (x - secX(d)) / secW())); }

function drawSa(exp) {
  cv.width = SA.W; cv.height = SA.H;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, SA.W, SA.H);
  const keys = dayKeys(), w = secW(), r = S.sa.range, step = r <= 3000 ? 1000 : r <= 6000 ? 3000 : 5000;
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 40px ' + FONT; ctx.textAlign = 'left';
  const items = keys.map(k => '― ' + DAY[k].name + ' ―'), ws = items.map(t => ctx.measureText(t).width);
  let x = (SA.W - ws.reduce((a, b) => a + b, 0) - 56 * (items.length - 1)) / 2;
  keys.forEach((k, i) => { ctx.fillStyle = DAY[k].color; ctx.fillText(items[i], x, 52); x += ws[i] + 56; });
  ctx.font = 'bold 34px ' + FONT;
  for (let v = -r; v <= r; v += step) {
    const y = vToY(v);
    ctx.save();
    ctx.strokeStyle = v === 0 ? '#fff' : 'rgba(255,255,255,.5)'; ctx.lineWidth = v === 0 ? 3 : 2.5;
    if (v !== 0) ctx.setLineDash([14, 10]);
    ctx.beginPath(); ctx.moveTo(SA.L, y); ctx.lineTo(SA.R, y); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#fff'; ctx.fillText(String(v), SA.R + 16, y);
  }
  for (let i = 1; i < keys.length; i++) {
    const xs = SA.L + i * w, today = keys[i] === 'd0';
    ctx.strokeStyle = today ? '#ff3b3b' : 'rgba(255,255,255,.22)'; ctx.lineWidth = today ? 4 : 2;
    ctx.beginPath(); ctx.moveTo(xs, SA.T - 12); ctx.lineTo(xs, SA.B + 12); ctx.stroke();
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(SA.L, SA.T - 6, SA.R - SA.L, SA.B - SA.T + 12); ctx.clip();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 7;
  keys.forEach(k => {
    const p = S.sa.pts[k]; if (!p.length) return;
    const x0 = secX(k);
    ctx.strokeStyle = DAY[k].color; ctx.beginPath(); ctx.moveTo(x0, vToY(0));
    p.forEach(q => ctx.lineTo(x0 + q.f * w, vToY(q.v)));
    ctx.stroke();
  });
  ctx.restore();
  if (!exp) keys.forEach(k => {
    const x0 = secX(k);
    S.sa.pts[k].forEach(q => {
      ctx.beginPath(); ctx.arc(x0 + q.f * w, vToY(q.v), 11, 0, Math.PI * 2);
      ctx.fillStyle = DAY[k].color; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
    });
  });
  saHits = [];
  ctx.font = 'bold 46px ' + FONT; ctx.textAlign = 'center';
  S.sa.labels.forEach((lb, i) => {
    if (!keys.includes(lb.day)) return;
    const lx = secX(lb.day) + lb.f * w, ly = vToY(lb.v), tw = ctx.measureText(lb.text).width;
    outlined(lb.text, lx, ly, '#fff');
    saHits.push({i, x1: lx - tw / 2 - 14, x2: lx + tw / 2 + 14, y1: ly - 36, y2: ly + 36});
  });
  if (!exp && keys.every(k => !S.sa.pts[k].length) && !S.sa.labels.length) {
    ctx.font = 'bold 40px ' + FONT; ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText('ここをタップして線を描く', (SA.L + SA.R) / 2, vToY(0) - 80);
  }
}

function saDown(e) {
  const p = pos(e); let t = null;
  for (let j = saHits.length - 1; j >= 0 && !t; j--) {
    const h = saHits[j];
    if (p.x >= h.x1 && p.x <= h.x2 && p.y >= h.y1 && p.y <= h.y2) t = {kind: 'lb', obj: S.sa.labels[h.i]};
  }
  if (!t && !labelMode) {
    let best = 16 * p.k; const w = secW();
    dayKeys().forEach(k => {
      const x0 = secX(k);
      S.sa.pts[k].forEach(q => {
        const d = Math.hypot(x0 + q.f * w - p.x, vToY(q.v) - p.y);
        if (d < best) { best = d; t = {kind: 'pt', day: k, obj: q}; }
      });
    });
  }
  drag = {t, x: p.x, y: p.y, k: p.k, moved: false, ly: p.y};
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
}
function outside(y) { return y > SA.B + 25 || y < SA.T - 25; }
function saMove(e) {
  if (!drag) return;
  const p = pos(e);
  drag.ly = p.y;
  if (!drag.moved) {
    if (Math.hypot(p.x - drag.x, p.y - drag.y) < 8 * drag.k) return;
    drag.moved = true; if (drag.t) snap();
  }
  const t = drag.t; if (!t) return;
  const v = yToV(p.y);
  if (t.kind === 'lb') { const d = dayAt(p.x); t.obj.day = d; t.obj.f = fAt(d, p.x); t.obj.v = v; }
  else {
    t.obj.f = fAt(t.day, p.x); t.obj.v = v;
    S.sa.pts[t.day].sort((a, b) => a.f - b.f);
  }
  setHint(outside(p.y) ? 'ここで離すと消えます' : t.kind === 'pt' ? DAY[t.day].name + '　' + fmtV(v) + '枚' : '');
  render();
}
function saUp() {
  const d = drag; drag = null;
  if (!d) return;
  const t = d.t;
  if (d.moved) {
    if (!t) return;
    if (outside(d.ly)) {
      const a = t.kind === 'lb' ? S.sa.labels : S.sa.pts[t.day];
      a.splice(a.indexOf(t.obj), 1);
      setHint('消しました（「戻す」で元どおり）');
    }
    changed(); return;
  }
  if (t && t.kind === 'lb') {
    const s = prompt('札の字（空にすると消えます）', t.obj.text);
    if (s === null) return;
    snap();
    if (!toHalf(s)) S.sa.labels.splice(S.sa.labels.indexOf(t.obj), 1); else t.obj.text = normLabel(s);
    changed(); return;
  }
  if (d.y < SA.T - 40 || d.y > SA.B + 40 || d.x < SA.L || d.x > SA.R) return;
  const day = dayAt(d.x), f = fAt(day, d.x), v = yToV(d.y);
  if (labelMode) {
    labelMode = false; const s = askLabel('5');
    if (s) { snap(); S.sa.labels.push({day, f, v, text: s}); }
    defaultHint(); changed(); return;
  }
  snap(); const a = S.sa.pts[day]; a.push({f, v}); a.sort((m, n) => m.f - n.f);
  setHint(DAY[day].name + '　' + fmtV(v) + '枚'); changed();
}

// ---- 当選履歴 ----
const RI = {W: 1200, L: 100, R: 1176, COLS: 10, TOP: 16, ROWH: 440};
const colW = () => (RI.R - RI.L) / RI.COLS;
function riOff() { return S.ri.cur === null ? 0 : 1; }
function riSlots() {
  const s = [];
  if (S.ri.cur !== null) s.push({kind: 'cur', g: S.ri.cur});
  S.ri.list.forEach((e, i) => s.push({kind: 'e', i, type: e.type, g: e.g}));
  return s;
}
function isSel(s) { return !!sel && sel.kind === s.kind && (s.kind === 'cur' || sel.i === s.i); }

function drawRi(exp) {
  const slots = riSlots(), rows = Math.max(1, Math.ceil(slots.length / RI.COLS)), H = RI.TOP + rows * RI.ROWH;
  const cw = colW(), max = S.ri.max, step = max <= 1500 ? 500 : 1000;
  cv.width = RI.W; cv.height = H;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, RI.W, H);
  ctx.textBaseline = 'middle';
  for (let r = 0; r < rows; r++) {
    const y0 = RI.TOP + r * RI.ROWH, bt = y0 + 74, bb = y0 + 320;
    ctx.fillStyle = '#131b36'; rr(RI.L - 10, y0, RI.R - RI.L + 20, RI.ROWH - 20, 14); ctx.fill();
    ctx.font = 'bold 26px ' + FONT; ctx.textAlign = 'right';
    for (let v = step; v <= max; v += step) {
      const y = bb - (bb - bt) * v / max;
      ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(RI.L, y); ctx.lineTo(RI.R, y); ctx.stroke();
      ctx.fillStyle = '#c9d1e6'; ctx.fillText(String(v), RI.L - 18, y);
    }
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2;
    for (let c = 1; c < RI.COLS; c++) { const x = RI.L + c * cw; ctx.beginPath(); ctx.moveTo(x, bt); ctx.lineTo(x, bb); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.moveTo(RI.L, bb); ctx.lineTo(RI.R, bb); ctx.stroke();
  }
  slots.forEach((s, n) => {
    const r = Math.floor(n / RI.COLS), c = n % RI.COLS, y0 = RI.TOP + r * RI.ROWH, bt = y0 + 74, bb = y0 + 320;
    const cx = RI.L + c * cw + cw / 2, col = s.kind === 'cur' ? CUR_COLOR : (TYPE_COLOR[s.type] || OTHER_COLOR);
    const h = s.g <= 0 ? 4 : Math.max(8, (bb - bt) * Math.min(s.g, max) / max);
    ctx.fillStyle = col; ctx.fillRect(cx - 32, bb - h, 64, h);
    if (s.g > max) {
      ctx.fillStyle = '#ffd23f'; ctx.beginPath();
      ctx.moveTo(cx, bt - 16); ctx.lineTo(cx + 18, bt + 4); ctx.lineTo(cx - 18, bt + 4); ctx.closePath(); ctx.fill();
    }
    const name = s.kind === 'cur' ? '現在' : s.type;
    ctx.fillStyle = col; rr(cx - cw / 2 + 6, y0 + 330, cw - 12, 44, 10); ctx.fill();
    let fs = 28; ctx.font = 'bold ' + fs + 'px ' + FONT;
    while (ctx.measureText(name).width > cw - 22 && fs > 16) { fs -= 2; ctx.font = 'bold ' + fs + 'px ' + FONT; }
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(name, cx, y0 + 353);
    ctx.font = 'bold 32px ' + FONT; ctx.fillText(String(s.g), cx, y0 + 396);
    const picking = arrowMode === 2 && s.kind === 'e' && s.i === arrowStart;
    if (!exp && (isSel(s) || picking)) {
      ctx.strokeStyle = picking ? '#f39ac7' : '#ffd23f'; ctx.lineWidth = 5;
      rr(cx - cw / 2 + 3, y0 + 66, cw - 6, 346, 10); ctx.stroke();
    }
  });
  riHits = [];
  const off = riOff();
  S.ri.arrows.forEach((a, ai) => {
    const s1 = a.from + off, s2 = a.to + off;
    if (s2 >= slots.length) return;
    const r1 = Math.floor(s1 / RI.COLS), r2 = Math.floor(s2 / RI.COLS), segs = [];
    for (let r = r1; r <= r2; r++) segs.push({r, c1: r === r1 ? s1 % RI.COLS : 0, c2: r === r2 ? s2 % RI.COLS : RI.COLS - 1});
    let best = segs[0];
    segs.forEach(g => { if (g.c2 - g.c1 > best.c2 - best.c1) best = g; });
    ctx.fillStyle = '#f39ac7';
    segs.forEach((g, si) => {
      const y = RI.TOP + g.r * RI.ROWH + 40, x1 = RI.L + g.c1 * cw + 8, x2 = RI.L + (g.c2 + 1) * cw - 8;
      if (si === 0) {
        ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x1 + 32, y - 22); ctx.lineTo(x1 + 32, y + 22); ctx.closePath(); ctx.fill();
        ctx.fillRect(x1 + 30, y - 9, x2 - x1 - 30, 18);
      } else ctx.fillRect(x1, y - 9, x2 - x1, 18);
      riHits.push({ai, x1, x2, y1: y - 32, y2: y + 32});
    });
    const y = RI.TOP + best.r * RI.ROWH + 40, xm = RI.L + (best.c1 + best.c2 + 1) / 2 * cw;
    ctx.font = 'bold 40px ' + FONT; ctx.textAlign = 'center'; outlined(a.text, xm, y, '#ffd23f');
  });
  if (!exp && !slots.length) {
    ctx.font = 'bold 36px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText('数字を打って種類を押すと棒がふえる', RI.W / 2, RI.TOP + 200);
  }
}

function riTap(e) {
  const p = pos(e), cw = colW();
  if (!arrowMode) for (const h of riHits) {
    if (p.x >= h.x1 && p.x <= h.x2 && p.y >= h.y1 && p.y <= h.y2) { editArrow(h.ai); return; }
  }
  const r = Math.floor((p.y - RI.TOP) / RI.ROWH), c = Math.floor((p.x - RI.L) / cw);
  if (r < 0 || c < 0 || c >= RI.COLS) return;
  const s = riSlots()[r * RI.COLS + c];
  if (!s) return;
  if (arrowMode) {
    if (s.kind !== 'e') { setHint('「現在」には矢印をつけられません'); return; }
    if (arrowMode === 1) { arrowStart = s.i; arrowMode = 2; setHint('おわりの棒をタップ'); render(); sync(); return; }
    const from = Math.min(arrowStart, s.i), to = Math.max(arrowStart, s.i);
    arrowMode = 0;
    const t = askLabel(String(to - from + 1));
    if (t) { snap(); S.ri.arrows.push({from, to, text: t}); }
    defaultHint(); changed(); return;
  }
  if (isSel(s)) sel = null;
  else { sel = s.kind === 'cur' ? {kind: 'cur'} : {kind: 'e', i: s.i}; num = String(s.g); }
  render(); sync();
}
function editArrow(ai) {
  const a = S.ri.arrows[ai], s = prompt('矢印の字（空にすると消えます）', a.text);
  if (s === null) return;
  snap();
  if (!toHalf(s)) S.ri.arrows.splice(ai, 1); else a.text = normLabel(s);
  changed();
}
function commit(type) {
  const g = parseInt(num || '0', 10);
  if (type === '他') {
    const s = prompt('種類の名前（例：ART、ボーナス）', S.ri.other);
    if (s === null || !s.trim()) return;
    type = s.trim().slice(0, 6); snap(); S.ri.other = type;
  } else snap();
  if (type === '現在' || (sel && sel.kind === 'cur')) S.ri.cur = g;
  else if (sel) S.ri.list[sel.i] = {type, g};
  else S.ri.list.push({type, g});
  sel = null; num = ''; defaultHint(); changed();
}
function delSel() {
  if (!sel) return;
  snap();
  if (sel.kind === 'cur') S.ri.cur = null;
  else {
    const i = sel.i;
    S.ri.list.splice(i, 1);
    S.ri.arrows = S.ri.arrows.filter(a => !(a.from === i && a.to === i))
      .map(a => ({...a, from: a.from > i ? a.from - 1 : a.from, to: a.to >= i ? a.to - 1 : a.to}));
  }
  sel = null; num = ''; changed();
}
function insBefore() {
  if (!sel || sel.kind !== 'e') return;
  snap();
  const i = sel.i;
  S.ri.list.splice(i, 0, {type: 'AT', g: 0});
  S.ri.arrows = S.ri.arrows.map(a => ({...a, from: a.from >= i ? a.from + 1 : a.from, to: a.to >= i ? a.to + 1 : a.to}));
  sel = {kind: 'e', i}; num = '';
  setHint('足した棒を選んでいます。数字と種類を押すと書きかわります'); changed();
}

// ---- 画面のつなぎ ----
function sync() {
  const sa = S.tab === 'sa';
  $('tabSa').classList.toggle('on', sa); $('tabRi').classList.toggle('on', !sa);
  $('paneSa').hidden = !sa; $('paneRi').hidden = sa;
  cv.style.touchAction = sa ? 'none' : 'manipulation';
  $('saLabel').classList.toggle('on', labelMode);
  $('saDays').value = String(S.sa.days); $('saRange').value = String(S.sa.range); $('riMax').value = String(S.ri.max);
  $('riArrow').classList.toggle('on', arrowMode > 0); $('riArrow').textContent = arrowMode ? '矢印をやめる' : '連の矢印';
  $('selRow').hidden = !sel; $('riIns').hidden = !(sel && sel.kind === 'e');
  $('num').textContent = num || '0';
  $('numNote').textContent = sel ? (sel.kind === 'cur' ? '「現在」を書きかえ中' : '選んだ棒を書きかえ中') : '';
}
function switchTab(t) {
  if (S.tab === t) return;
  S.tab = t; sel = null; arrowMode = 0; labelMode = false; drag = null;
  defaultHint(); changed(); window.scrollTo(0, 0);
}
function stamp() {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes());
}
function makeImage() {
  sel = null; arrowMode = 0; labelMode = false;
  render(true);
  const url = cv.toDataURL('image/png'), name = (S.tab === 'sa' ? 'samai' : 'rireki') + '_' + stamp() + '.png';
  $('outImg').src = url; $('dl').href = url; $('dl').download = name;
  outFile = null; $('share').hidden = true;
  cv.toBlob(b => {
    try {
      const f = new File([b], name, {type: 'image/png'});
      if (navigator.canShare && navigator.canShare({files: [f]})) { outFile = f; $('share').hidden = false; }
    } catch (_) {}
  }, 'image/png');
  render(); sync();
  $('out').hidden = false;
}

['7', '8', '9', '4', '5', '6', '1', '2', '3', 'C', '0', '⌫'].forEach(k => {
  const b = document.createElement('button'); b.textContent = k;
  b.onclick = () => {
    if (k === '⌫') num = num.slice(0, -1);
    else if (k === 'C') num = '';
    else if (num.length < 5) num = (num === '0' ? '' : num) + k;
    sync();
  };
  $('keys').appendChild(b);
});
document.querySelectorAll('.types button').forEach(b => { b.onclick = () => commit(b.dataset.t); });
$('tabSa').onclick = () => switchTab('sa'); $('tabRi').onclick = () => switchTab('ri');
$('saLabel').onclick = () => { labelMode = !labelMode; if (labelMode) setHint('札を置く所をタップ'); else defaultHint(); sync(); };
$('saUndo').onclick = undo; $('riUndo').onclick = undo;
$('saClear').onclick = () => {
  if (!confirm('差枚グラフの線と札を全部消しますか？（「戻す」で元にもどせます）')) return;
  snap(); S.sa.pts = {d2: [], d1: [], d0: []}; S.sa.labels = []; changed();
};
$('riClear').onclick = () => {
  if (!confirm('当選履歴を全部消しますか？（「戻す」で元にもどせます）')) return;
  snap(); S.ri.cur = null; S.ri.list = []; S.ri.arrows = []; sel = null; num = ''; changed();
};
$('saDays').onchange = e => { snap(); S.sa.days = +e.target.value; changed(); };
$('saRange').onchange = e => { snap(); S.sa.range = +e.target.value; changed(); };
$('riMax').onchange = e => { snap(); S.ri.max = +e.target.value; changed(); };
$('riArrow').onclick = () => {
  if (arrowMode) { arrowMode = 0; defaultHint(); }
  else { arrowMode = 1; sel = null; setHint('はじめの棒をタップ（左が新しい方）'); }
  render(); sync();
};
$('riDel').onclick = delSel; $('riIns').onclick = insBefore;
$('make').onclick = makeImage;
$('close').onclick = () => { $('out').hidden = true; };
$('share').onclick = () => { if (outFile) navigator.share({files: [outFile]}).catch(() => {}); };

cv.addEventListener('pointerdown', e => { if (S.tab === 'sa') { e.preventDefault(); saDown(e); } });
cv.addEventListener('pointermove', e => { if (S.tab === 'sa') saMove(e); });
cv.addEventListener('pointerup', e => { if (S.tab === 'sa') saUp(e); });
cv.addEventListener('pointercancel', () => { if (drag && drag.moved && drag.t) changed(); drag = null; });
cv.addEventListener('click', e => { if (S.tab === 'ri') riTap(e); });

defaultHint(); render(); sync();
})();
</script>
</body>
</html>
